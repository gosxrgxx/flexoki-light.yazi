[app]
overall = { bg = "#FFFCF0" }

[mgr]
cwd = { fg = "#100F0F", bold = true }

find_keyword = { fg = "#24837B", reversed = true }
find_position = { fg = "#24837B", bold = true, italic = true }

marker_copied = { fg = "#66800B", bg = "#66800B" }
marker_cut = { fg = "#AF3029", bg = "#AF3029" }
marker_marked = { fg = "#5ABDAC", bg = "#5ABDAC" }
marker_selected = { fg = "#24837B", bg = "#24837B" }

count_copied = { fg = "#66800B", bold = true, reversed = true }
count_cut = { fg = "#AF3029", bold = true, reversed = true }
count_selected = { fg = "#24837B", bold = true, reversed = true }

border_symbol = "│"
border_style = { fg = "#E6E4D9" }

[indicator]
parent = { underline = true }
current = { fg = "#100F0F", bg = "#E6E4D9" }
preview = { underline = true }
padding = { open = "█", close = "█" }

[tabs]
active = { fg = "#100F0F", bg = "#CECDC3", bold = true }
inactive = { fg = "#6F6E69", bg = "#E6E4D9" }
sep_inner = { open = "", close = "" }
sep_outer = { open = "", close = "" }

[mode]
normal_main = { fg = "#100F0F", bg = "#CECDC3", bold = true }
normal_alt = { fg = "#6F6E69", bg = "#E6E4D9" }

select_main = { fg = "#FFFCF0", bg = "#24837B", bold = true }
select_alt = { fg = "#24837B", bg = "#BFE8D9" }

unset_main = { fg = "#FFFCF0", bg = "#24837B", bold = true }
unset_alt = { fg = "#24837B", bg = "#BFE8D9" }

[status]
overall = { fg = "#100F0F" }

perm_type = { fg = "#205EA6" }
perm_read = { fg = "#AD8301" }
perm_write = { fg = "#AF3029" }
perm_exec = { fg = "#66800B" }
perm_sep = { fg = "#6F6E69" }

progress_label = { fg = "#FFFCF0" }
progress_normal = { fg = "#24837B", bg = "#5ABDAC" }
progress_error = { bg = "#AF3029" }

[which]
border = { fg = "#CECDC3" }
cols = 3
mask = { bg = "#FFFCF0" }
cand = { fg = "#24837B", bold = true }
rest = { fg = "#24837B", italic = true }
desc = { fg = "#B7B5AC" }
separator = " "
separator_style = { }

[confirm]
border = { fg = "#CECDC3" }
title = { fg = "#B7B5AC", bold = true }
body = { fg = "#100F0F", bold = true }
list = { fg = "#100F0F" }
btn_yes = { fg = "#100F0F", bg = "#CECDC3", bold = true }
btn_no = { fg = "#6F6E69", bg = "#E6E4D9" }

[spot]
border = { fg = "#CECDC3" }
title = { fg = "#B7B5AC", bold = true }
tbl_col = { fg = "#6F6E69" }
tbl_cell = { fg = "#100F0F", bg = "#E6E4D9" }

[notify]
title_info = { fg = "#205EA6" }
title_warn = { fg = "#BC5215" }
title_error = { fg = "#AF3029" }

[pick]
border = { fg = "#CECDC3", bold = true }
active = { fg = "#100F0F" }
inactive = { fg = "#6F6E69" }

[input]
border = { fg = "#CECDC3" }
title = { fg = "#B7B5AC", bold = true }
value = { fg = "#100F0F" }
selected = { bg = "#F2F0E5" }

[cmp]
border = { fg = "#CECDC3", bold = true }
active = { fg = "#100F0F", bg = "#E6E4D9" }
inactive = { fg = "#6F6E69" }

[tasks]
border = { fg = "#CECDC3" }
title = { fg = "#B7B5AC", bold = true }
hovered = { fg = "#100F0F", bg = "#E6E4D9" }

[help]
border = { fg = "#CECDC3" }
chord = { fg = "#24837B", bold = true }
action = { fg = "#B7B5AC" }
hovered = { bg = "#E6E4D9" }

[filetype]
rules = [
  { mime = "inode/empty", fg = "#B7B5AC" },

  { url = "*", is = "orphan", fg = "#B7B5AC" },
  { url = "*/", is = "orphan", fg = "#B7B5AC" },
  { url = "*", is = "link", fg = "#24837B" },
  { url = "*/", is = "link", fg = "#24837B" },
  { url = "*", is = "block", fg = "#100F0F" },
  { url = "*", is = "char", fg = "#100F0F" },
  { url = "*", is = "fifo", fg = "#A02F6F" },
  { url = "*", is = "sock", fg = "#A02F6F" },
  { url = "*", is = "sticky", fg = "#100F0F" },
  { url = "*", is = "dummy", fg = "#B7B5AC" },

  { url = "*/", fg = "#100F0F" },
  { url = "*", is = "exec", fg = "#66800B" },
  { url = "*", fg = "#6F6E69" }
]

[icon]
dirs = [
  { name = ".config", text = "", fg = "#24837B" },
  { name = ".git", text = "", fg = "#24837B" },
  { name = ".github", text = "", fg = "#24837B" },
  { name = ".npm", text = "", fg = "#24837B" },
  { name = "Desktop", text = "", fg = "#24837B" },
  { name = "Development", text = "", fg = "#24837B" },
  { name = "Documents", text = "", fg = "#24837B" },
  { name = "Downloads", text = "", fg = "#24837B" },
  { name = "Library", text = "", fg = "#24837B" },
  { name = "Movies", text = "", fg = "#24837B" },
  { name = "Music", text = "", fg = "#24837B" },
  { name = "Pictures", text = "", fg = "#24837B" },
  { name = "Public", text = "", fg = "#24837B" },
  { name = "Videos", text = "", fg = "#24837B" }
]
conds = [
  { if = "orphan", text = "", fg = "#B7B5AC" },
  { if = "link", text = "", fg = "#24837B" },
  { if = "block", text = "", fg = "#100F0F" },
  { if = "char", text = "", fg = "#100F0F" },
  { if = "fifo", text = "", fg = "#A02F6F" },
  { if = "sock", text = "", fg = "#A02F6F" },
  { if = "sticky", text = "", fg = "#100F0F" },
  { if = "dummy", text = "", fg = "#B7B5AC" },

  { if = "dir", text = "", fg = "#24837B" },
  { if = "exec", text = "", fg = "#66800B" },
  { if = "!dir", text = "", fg = "#6F6E69" }
]